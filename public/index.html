<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Interview Prep Coach</title>
<style>
  :root {
    --navy: #1f3864;
    --orange: #f6821f;
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #6b7280;
    --border: #e2e5ea;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 20px 24px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--card);
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 20px;
    color: var(--navy);
  }
  header p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }
  .status {
    display: inline-block;
    margin-top: 8px;
    font-size: 12px;
    color: var(--orange);
    font-weight: 600;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg {
    max-width: 85%;
    padding: 12px 14px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--navy);
    color: white;
    border-bottom-right-radius: 2px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--card);
    border: 1px solid var(--border);
    border-bottom-left-radius: 2px;
  }
  .msg.system {
    align-self: center;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-style: italic;
  }
  form {
    display: flex;
    gap: 8px;
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    background: var(--card);
  }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    height: 44px;
  }
  button {
    border: none;
    background: var(--orange);
    color: white;
    font-weight: 600;
    padding: 0 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  button.secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Interview Prep Coach</h1>
      <p>Paste a job description to start. I'll pull out the key skills, ask you tailored questions one at a time, and give feedback as we go.</p>
      <span class="status" id="status">Starting session…</span>
    </header>

    <div id="messages"></div>

    <form id="chatForm">
      <textarea id="input" placeholder="Paste a job description to begin…" required></textarea>
      <button type="submit" id="sendBtn">Send</button>
      <button type="button" class="secondary" id="resetBtn">Reset</button>
    </form>
  </div>

<script>
  const messagesEl = document.getElementById("messages");
  const form = document.getElementById("chatForm");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const resetBtn = document.getElementById("resetBtn");
  const statusEl = document.getElementById("status");

  let sessionId = null;

  function addMessage(role, text) {
    const el = document.createElement("div");
    el.className = "msg " + role;
    el.textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function startSession() {
    statusEl.textContent = "Starting session…";
    const res = await fetch("/api/session", { method: "POST" });
    const data = await res.json();
    sessionId = data.sessionId;
    statusEl.textContent = "Session ready — paste a job description below";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || !sessionId) return;

    addMessage("user", text);
    input.value = "";
    sendBtn.disabled = true;
    statusEl.textContent = "Thinking…";

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ sessionId, message: text }),
      });
      const data = await res.json();
      if (data.error) {
        addMessage("system", "Error: " + data.error);
      } else {
        addMessage("assistant", data.reply);
        statusEl.textContent =
          data.stage === "interviewing"
            ? `Questions asked: ${data.questionsAsked}`
            : "Session ready";
      }
    } catch (err) {
      addMessage("system", "Something went wrong. Please try again.");
    } finally {
      sendBtn.disabled = false;
    }
  });

  resetBtn.addEventListener("click", async () => {
    if (!sessionId) return;
    await fetch("/api/reset", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ sessionId }),
    });
    messagesEl.innerHTML = "";
    addMessage("system", "Session reset. Paste a new job description to start again.");
  });

  startSession();
</script>
</body>
</html>
